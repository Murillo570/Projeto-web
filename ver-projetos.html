<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Projetos - Valorant</title>
    <link rel="stylesheet" href="../css/ver-projetos.css">
</head>

<body>

    <img src="../img/fundo-val.jpg" class="fundo-animado-1" alt="Fundo 1">
    <img src="../img/fundo-val2.jpg" class="fundo-animado-2" alt="Fundo 2">
    <img src="../img/fundo-val3.jpg" class="fundo-animado-3" alt="Fundo 3">
    <img src="../img/fundo-val4.jpg" class="fundo-animado-4" alt="Fundo 4">
    <img src="../img/fundo-val5.jpg" class="fundo-animado-5" alt="Fundo 5">
    <img src="../img/fundo-val6.webp" class="fundo-animado-6" alt="Fundo 6">

    <header class="barra-topo">
        <div class="area-logo-titulo">
            <img src="../img/Riot-logo.png" alt="Riot Games" class="imagem-logo-riot">
            <h1 class="titulo-painel">GERENCIADOR DE PROJETOS</h1>
        </div>
        <div class="area-usuario">
            <a href="../index.html" class="botao-sair">Sair</a>
        </div>
    </header>

    <main class="quadro-tarefas">

        <section class="coluna-tarefas">
            <div class="cabecalho-coluna">
                <h2>SOLICITAÇÕES</h2>
                <span class="contador-cards">2</span>
            </div>
            <div class="lista-cards">
                <a href="../visualizacao-projetos/ayame.html">
                    <article class="card-projeto">
                        <div class="indicador-prioridade prioridade-alta"></div>
                        <h3 class="nome-projeto">Ayame - Sentinela</h3>
                        <div class="capa-projeto">
                            <img src="..//Projetos-recebidos/Agentes/Ayame-sentinela/ayame-projeto.png" alt="Ayame">
                        </div>
                        <div class="rodape-card">
                            <span class="status-projeto">Pendente</span>
                            <a href="../visualizacao-projetos/ayame.html" class="botao-detalhes">Ver Detalhes</a>
                        </div>
                    </article>

                </a>
                <a href="../visualizacao-projetos/kael.html">
                    <article class="card-projeto">
                        <div class="indicador-prioridade prioridade-media"></div>
                        <h3 class="nome-projeto">Kael - Duelista</h3>
                        <div class="capa-projeto">
                            <img src="../Projetos-recebidos/Agentes/Kael-duelista/kael-projeto.png" alt="Kael">
                        </div>
                        <div class="rodape-card">
                            <span class="status-projeto">Pendente</span>
                            <a href="../visualizacao-projetos/kael.html" class="botao-detalhes">Ver Detalhes</a>
                        </div>
                    </article>
                </a>


            </div>
        </section>

        <section class="coluna-tarefas">
            <div class="cabecalho-coluna">
                <h2>EM PRODUÇÃO</h2>
                <span class="contador-cards">1</span>
            </div>
            <div class="lista-cards">

                <a href="../visualizacao-projetos/sora.html">
                    <article class="card-projeto">
                        <div class="indicador-prioridade prioridade-baixa"></div>
                        <h3 class="nome-projeto">Sora - Duelista</h3>
                        <div class="capa-projeto">
                            <img src="../Projetos-recebidos/Agentes/Sora-duelista/sora-projeto.png" alt="Sora">
                        </div>
                        <div class="rodape-card">
                            <span class="status-projeto">Em andamento</span>
                            <a href="../Projetos-recebidos/Sora-duelista/" class="botao-detalhes">Ver Detalhes</a>
                        </div>
                    </article>
                </a>

            </div>
        </section>

        <section class="coluna-tarefas">
            <div class="cabecalho-coluna">
                <h2>EM ANÁLISE</h2>
                <span class="contador-cards">0</span>
            </div>
            <div class="lista-cards">
            </div>
        </section>

        <section class="coluna-tarefas">
            <div class="cabecalho-coluna">
                <h2>APROVADOS</h2>
                <span class="contador-cards">0</span>
            </div>
            <div class="lista-cards">
            </div>
        </section>

    </main>

</body>

</html>
